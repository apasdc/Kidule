<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kidule">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Kidule</title>
<style>
  :root{
    --bg:#f4f5f9; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e7e9ef; --brand:#4f46e5; --brand-soft:#eef0ff;
    --green:#16a34a; --red:#dc2626; --amber:#d97706; --slate:#64748b;
    --shadow:0 1px 3px rgba(20,24,40,.08),0 1px 2px rgba(20,24,40,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;
    padding-bottom:78px;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 14px;}
  header.app{
    position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
    padding:14px 14px 12px;box-shadow:var(--shadow);
  }
  header.app .wrap{display:flex;align-items:center;justify-content:space-between;}
  header.app h1{font-size:18px;margin:0;font-weight:700;}
  header.app .sub{font-size:12px;opacity:.85;margin-top:2px;}
  .iconbtn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;
    width:38px;height:38px;font-size:18px;cursor:pointer;display:grid;place-items:center;}
  h2.section{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    margin:18px 0 8px;font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
  .card .body{padding:12px 14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .spacer{flex:1;}
  .muted{color:var(--muted);}
  .small{font-size:13px;}
  .tiny{font-size:11.5px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
    background:var(--brand-soft);color:var(--brand);white-space:nowrap;}
  .pill.green{background:#e7f6ec;color:var(--green);}
  .pill.red{background:#fdeaea;color:var(--red);}
  .pill.amber{background:#fdf1e1;color:var(--amber);}
  .pill.slate{background:#eef1f5;color:var(--slate);}
  .stripe{width:5px;align-self:stretch;border-radius:6px;}
  .btn{border:none;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;
    cursor:pointer;background:var(--brand);color:#fff;}
  .btn.ghost{background:#eef0f5;color:var(--ink);}
  .btn.line{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn.sm{padding:7px 11px;font-size:13.5px;border-radius:9px;}
  .btn.block{width:100%;}
  .btn.danger{background:#fdeaea;color:var(--red);}
  .weeknav{display:flex;align-items:center;gap:8px;margin:14px 0 6px;}
  .weeknav .label{flex:1;text-align:center;font-weight:700;}
  .daygroup{margin-bottom:6px;}
  .dayhead{display:flex;align-items:center;gap:8px;margin:14px 2px 6px;}
  .dayhead .dname{font-weight:700;}
  .dayhead.today .dname{color:var(--brand);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);}
  .sess{display:flex;align-items:stretch;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;}
  .sess .time{width:64px;font-weight:700;font-size:13.5px;}
  .sess .who{font-size:12px;color:var(--muted);}
  .sess.done{opacity:.62;}
  .sess.moved,.sess.cancelled{opacity:.55;}
  .sess.moved .nm,.sess.cancelled .nm{text-decoration:line-through;}
  .empty{color:var(--muted);font-size:14px;padding:8px 2px;}
  .progress{height:8px;background:#eef0f5;border-radius:999px;overflow:hidden;margin-top:6px;}
  .progress>i{display:block;height:100%;background:var(--brand);}
  .progress.low>i{background:var(--red);}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-top:3px;}
  .child-tab{display:flex;gap:8px;margin:6px 0 12px;}
  .child-tab button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-weight:600;cursor:pointer;font-size:14px;}
  .child-tab button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:-6px;display:inline-block;}
  .avatar.lg{width:34px;height:34px;vertical-align:-11px;}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .mgrid .dow{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;padding:2px 0;}
  .mcell{min-height:54px;border:1px solid var(--line);border-radius:8px;padding:3px 3px 4px;background:#fff;overflow:hidden;}
  .mcell.out{background:#f7f8fb;opacity:.5;}
  .mcell.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;}
  .mcell .dnum{font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.1;}
  .mdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:1px;}
  .mcell .mcount{font-size:9.5px;color:var(--muted);}
  .joinbtn{text-decoration:none;display:inline-flex;align-items:center;}
  body.kidmode nav.tabbar{display:none;}
  body.kidmode #btnBackupTop{display:none;}
  body.kidmode{padding-bottom:14px;}
  /* bottom nav */
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  nav.tabbar button{flex:1;border:none;background:none;padding:9px 0 11px;cursor:pointer;color:var(--muted);
    font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav.tabbar button .ic{font-size:20px;}
  nav.tabbar button.on{color:var(--brand);}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:50;display:none;
    align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px 22px;
    max-height:88vh;overflow:auto;animation:up .18s ease;}
  @keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{margin:2px 0 14px;font-size:17px;}
  label.fld{display:block;margin:10px 0;font-size:13px;color:var(--muted);font-weight:600;}
  label.fld input,label.fld select,label.fld textarea{
    width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;color:var(--ink);background:#fff;font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .slotrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
  .slotrow select,.slotrow input{padding:9px;border:1px solid var(--line);border-radius:9px;font-size:15px;}
  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .action-list button{width:100%;text-align:left;padding:14px;border:1px solid var(--line);
    background:#fff;border-radius:12px;margin-bottom:8px;font-size:15px;font-weight:600;cursor:pointer;}
  .action-list button .sub{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px;}
  .totline{display:flex;justify-content:space-between;font-size:14px;margin:4px 0;}
  .totline b{font-weight:700;}
  .hint{background:var(--brand-soft);color:#3730a3;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:10px;}
  .migrate-banner{background:#fdf1e1;border-bottom:1px solid #f3d9a8;padding:10px 14px;font-size:13px;color:#7c4a03;display:flex;align-items:center;gap:10px;}
  .migrate-banner b{display:block;font-size:13.5px;margin-bottom:2px;}
  .migrate-banner .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .migrate-banner button{border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .migrate-banner .go{background:var(--amber);color:#fff;}
  .migrate-banner .later{background:transparent;color:#7c4a03;text-decoration:underline;padding:7px 4px;}
  .migrate-banner .x{margin-left:auto;background:transparent;color:#7c4a03;font-size:18px;line-height:1;padding:2px 6px;align-self:flex-start;}
</style>
</head>
<body>
<div id="migrateBanner" class="migrate-banner" style="display:none">
  <div style="flex:1">
    <b>⚠ We're moving hosting soon</b>
    This app is switching to a new address, and your saved data stays on this device — it won't move by itself. Please back up now so nothing is lost.
    <div class="row">
      <button class="go" id="mb_backup">⬇ Back up now</button>
      <button class="later" id="mb_later">Remind me later</button>
    </div>
  </div>
  <button class="x" id="mb_close" title="Dismiss">×</button>
</div>
<header class="app">
  <div class="wrap">
    <div>
      <h1>Kidule</h1>
      <div class="sub" id="headsub">Schedule · classes · fees</div>
    </div>
    <button class="iconbtn" id="btnBackupTop" title="Backup / restore">⋯</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabbar">
  <button data-tab="week" class="on"><span class="ic">🗓️</span>Week</button>
  <button data-tab="classes"><span class="ic">📚</span>Classes</button>
  <button data-tab="money"><span class="ic">💰</span>Money</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* ---------------- storage ---------------- */
var KEY="kidsClassTracker_v1";
var state=null;

function seed(){return {children:[],classes:[],attendance:[],payments:[],currencies:[],events:[]};}
function migrate(){if(!state.currencies)state.currencies=[];if(!state.events)state.events=[];}
function load(){try{var s=localStorage.getItem(KEY);state=s?JSON.parse(s):seed();}catch(e){state=seed();}migrate();save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function uid(){return "id"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}

/* ---------------- date utils ---------------- */
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DAYSLONG=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pad(n){return n<10?"0"+n:""+n;}
function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function weekStart(d){var x=new Date(d);x.setHours(0,0,0,0);var day=x.getDay();return addDays(x,day===0?-6:1-day);}
function fmtTime(t){if(!t)return"";var p=t.split(":");var h=+p[0];var ap=h<12?"AM":"PM";var hh=h%12;if(hh===0)hh=12;return hh+":"+p[1]+" "+ap;}
function fmtDateShort(d){return DAYS[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function money(a,c){if(a==null||a==="")return"—";return (c?c+" ":"")+Number(a).toLocaleString();}
function toMin(t){if(!t)return null;var p=t.split(":");return (+p[0])*60+(+p[1]);}
function durMin(a,b){var x=toMin(a),y=toMin(b);return (x!=null&&y!=null&&y>x)?y-x:null;}
function durLabel(m){var h=Math.floor(m/60),mm=m%60;return h?(h+"h"+(mm?mm:"")):(mm+"m");}

/* ---------------- lookups ---------------- */
function childById(id){return state.children.filter(function(c){return c.id===id;})[0];}
function classById(id){return state.classes.filter(function(c){return c.id===id;})[0];}
function getAtt(classId,date){return state.attendance.filter(function(a){return a.classId===classId&&a.date===date;})[0]||null;}
function upsertAtt(classId,date,patch){
  var a=getAtt(classId,date);
  if(!a){a={id:uid(),classId:classId,date:date};state.attendance.push(a);}
  for(var k in patch)a[k]=patch[k];
  save();return a;
}
function consumedCount(classId,cyc){
  var c=classById(classId);var charge=c&&c.chargeOnStudentCancel;
  var base=(!cyc&&c&&c.openingTaken)?(+c.openingTaken):0;
  return base+state.attendance.filter(function(a){
    if(a.classId!==classId)return false;
    if(cyc&&(!a.date||a.date<cyc))return false;
    return a.status==="attended"||(charge&&a.status==="missed");
  }).length;
}
function takenCount(classId){return consumedCount(classId,null);}

/* money math for a class */
function classMoney(c){
  var cyc=((c.feeType==="prepaid"||c.feeType==="postpaid")&&c.cycleStart)?c.cycleStart:null;
  var pays=state.payments.filter(function(p){return p.classId===c.id&&(!cyc||(p.date&&p.date>=cyc));});
  var paidByCur={};var prepaidClasses=0,postpaidClasses=0;
  pays.forEach(function(p){
    paidByCur[p.currency]=(paidByCur[p.currency]||0)+(+p.amount||0);
    if(p.type==="prepaid")prepaidClasses+=(+p.classesCovered||0);
    else postpaidClasses+=(+p.classesCovered||0);
  });
  var taken=consumedCount(c.id,cyc);
  var r={taken:taken,paidByCur:paidByCur,prepaidClasses:prepaidClasses,postpaidClasses:postpaidClasses,outByCur:{},cycleStart:cyc};
  if(c.feeType==="prepaid"){
    var total=cyc?(c.cycleSize||prepaidClasses):prepaidClasses;
    r.prepaidClasses=total;
    r.remaining=total-taken;
    var over=Math.max(0,taken-total);
    if(c.perClassFee&&c.currency&&over>0)r.outByCur[c.currency]=over*c.perClassFee;
  }else if(c.feeType==="postpaid"){
    var unpaid=Math.max(0,taken-postpaidClasses);
    r.unpaid=unpaid;
    if(c.perClassFee&&c.currency&&unpaid>0)r.outByCur[c.currency]=unpaid*c.perClassFee;
  }
  return r;
}

/* ---------------- rendering ---------------- */
var current={tab:"week",weekStart:isoOf(weekStart(new Date())),monthAnchor:isoOf(new Date()),moneyChild:"all",classChild:"all"};
var KID=((location.search+location.hash).toLowerCase().indexOf("kid")>=0)||(location.pathname.toLowerCase().indexOf("/kid")>=0)||(function(){try{return localStorage.getItem("ct_kidlock")==="1";}catch(e){return false;}})();

function render(){
  var v=document.getElementById("view");
  if(KID){v.innerHTML=renderKid();bindView();return;}
  if(current.tab==="week")v.innerHTML=renderWeek();
  else if(current.tab==="classes")v.innerHTML=renderClasses();
  else v.innerHTML=renderMoney();
  bindView();
}

/* ----- WEEK ----- */
function weekSessions(ws){
  var start=parseISO(ws);var byDay=[[],[],[],[],[],[],[]]; // index 0..6 = Mon..Sun
  for(var i=0;i<7;i++){
    var date=addDays(start,i);var diso=isoOf(date);var js=date.getDay();
    state.classes.forEach(function(c){
      if(!c.active)return;
      (c.slots||[]).forEach(function(s){
        if(s.day===js){
          var att=getAtt(c.id,diso);
          byDay[i].push({classId:c.id,date:diso,time:s.time,end:s.end,status:att?att.status:"scheduled",att:att,kind:"recurring"});
        }
      });
    });
  }
  // extra / moved-to sessions
  state.attendance.forEach(function(a){
    if(!a.isExtra)return;
    var d=parseISO(a.date);var idx=Math.floor((d-start)/86400000);
    if(idx>=0&&idx<7)byDay[idx].push({classId:a.classId,date:a.date,time:a.time||"",status:a.status||"scheduled",att:a,kind:"extra"});
  });
  (state.events||[]).forEach(function(ev){
    var d=parseISO(ev.date);var idx=Math.floor((d-start)/86400000);
    if(idx>=0&&idx<7)byDay[idx].push({kind:"event",event:ev,time:ev.time||""});
  });
  byDay.forEach(function(arr){arr.sort(function(x,y){return (x.time||"").localeCompare(y.time||"");});});
  return byDay;
}
function renderWeek(){
  var ws=current.weekStart;var start=parseISO(ws);var end=addDays(start,6);
  var byDay=weekSessions(ws);var todayIso=isoOf(new Date());
  var h="";
  h+='<div class="weeknav">'+
       '<button class="btn ghost sm" data-week="-1">‹</button>'+
       '<div class="label">'+start.getDate()+" "+MON[start.getMonth()]+" – "+end.getDate()+" "+MON[end.getMonth()]+'</div>'+
       '<button class="btn ghost sm" data-week="1">›</button></div>';
  h+='<div class="row" style="margin-bottom:6px"><button class="btn line sm" data-week="0">This week</button>'+
     '<span class="spacer"></span><button class="btn sm" id="addSess">+ One-off class</button></div>';
  for(var i=0;i<7;i++){
    var date=addDays(start,i);var diso=isoOf(date);var isToday=diso===todayIso;
    h+='<div class="daygroup"><div class="dayhead'+(isToday?" today":"")+'">'+
       (isToday?'<span class="dot"></span>':"")+
       '<span class="dname">'+DAYSLONG[date.getDay()]+'</span>'+
       '<span class="muted small">'+date.getDate()+" "+MON[date.getMonth()]+(isToday?" · Today":"")+'</span></div>';
    if(byDay[i].length===0){h+='<div class="empty">No classes</div>';}
    else{
      byDay[i].forEach(function(s){
        if(s.kind==="event"){var ev=s.event;var est=ev.status||"scheduled";
          var ecls="sess"+(est==="attended"?" done":"")+(est==="cancelled"?" cancelled":"");
          var ebadge=est==="attended"?'<span class="pill green">✓ Attended</span>':est==="cancelled"?'<span class="pill red">Cancelled</span>':'<span class="pill slate">One-time</span>';
          h+='<div class="'+ecls+'" data-open-event="'+ev.id+'"><div class="stripe" style="background:'+(ev.color||"#8b5cf6")+'"></div>'+
             '<div class="time">'+(ev.time?fmtTime(ev.time):"—")+'</div>'+
             '<div style="flex:1"><div class="nm" style="font-weight:600">'+esc(ev.title)+'</div>'+
             (ev.note?'<div class="tiny muted">📝 '+esc(ev.note)+'</div>':"")+'</div>'+
             '<div>'+ebadge+'</div></div>';
          return;}
        var c=classById(s.classId);var ch=childById(c.childId);
        var cls="sess"+(s.status==="attended"?" done":"")+(s.status==="moved"?" moved":"")+(s.status==="cancelled"?" cancelled":"")+(s.status==="missed"?" cancelled":"");
        var badge="";
        if(s.status==="attended")badge='<span class="pill green">✓ Attended</span>';
        else if(s.status==="cancelled")badge='<span class="pill red">Class off</span>';
        else if(s.status==="missed")badge='<span class="pill amber">Absent</span>';
        else if(s.status==="moved")badge='<span class="pill amber">Moved'+(s.att&&s.att.movedTo?" → "+fmtDateShort(parseISO(s.att.movedTo)):"")+'</span>';
        else badge='<span class="pill slate">Scheduled</span>';
        var moveTag=(s.kind==="extra"&&s.att&&s.att.movedFrom)?'<span class="tiny muted"> · moved here</span>':"";
        var noteTag=(s.att&&s.att.note)?'<div class="tiny muted">📝 '+esc(s.att.note)+'</div>':"";
        var quick=(c.link?'<a class="btn sm joinbtn" data-stop href="'+esc(c.link)+'" target="_blank" rel="noopener">Join</a>':"")+
                  (c.location?'<a class="btn line sm joinbtn" data-stop href="'+mapUrl(c.location)+'" target="_blank" rel="noopener">📍</a>':"");
        var _dm=durMin(s.time,s.end);
        var _mh=_dm?' style="min-height:'+Math.max(56,Math.round(30+_dm*0.5))+'px"':"";
        h+='<div class="'+cls+'"'+_mh+' data-open-sess="'+s.classId+'|'+s.date+'|'+s.time+'|'+s.kind+'">'+
             '<div class="stripe" style="background:'+c.color+'"></div>'+
             '<div class="time">'+(s.time?fmtTime(s.time):"—")+(s.end?'<div class="tiny muted" style="font-weight:400">'+fmtTime(s.end)+'</div>':"")+'</div>'+
             '<div style="flex:1"><div class="nm" style="font-weight:600">'+esc(c.name)+(_dm?' <span class="tiny muted">· '+durLabel(_dm)+'</span>':"")+moveTag+'</div>'+
               '<div class="who">'+childIcon(ch)+" "+esc(ch.name)+'</div>'+noteTag+'</div>'+
             (quick?'<div class="row" style="gap:6px;flex:0 0 auto">'+quick+'</div>':"")+
             '<div>'+badge+'</div></div>';
      });
    }
    h+='</div>';
  }
  return h;
}

/* ----- CLASSES ----- */
function renderClasses(){
  var h=childTabs("classChild");
  var kids=current.classChild==="all"?state.children:state.children.filter(function(c){return c.id===current.classChild;});
  kids.forEach(function(ch){
    var cls=state.classes.filter(function(c){return c.childId===ch.id;});
    h+='<h2 class="section" style="display:flex;align-items:center;gap:6px">'+childIcon(ch)+" "+esc(ch.name)+(childAge(ch)!==""?" · "+childAge(ch)+"y":"")+" · "+cls.length+" classes"+'<button class="btn line sm" data-edit-child="'+ch.id+'" style="margin-left:auto;padding:3px 9px" title="Edit person">✎</button></h2>';

         (m.remaining>0?m.remaining+" classes left":(m.remaining===0?"Package finished — renew":Math.abs(m.remaining)+" classes over package — renew"))+'</div>';

    if(m.cycleStart)h+='<div class="tiny muted" style="margin-top:4px">Counting since '+fmtDateShort(parseISO(m.cycleStart))+'</div>';
  }else if(c.feeType==="monthly"){
    h+='<div class="kv"><span>Fee</span><b>'+((c.perClassFee&&c.currency)?money(c.perClassFee,c.currency)+" / month":"Monthly")+'</b></div>';
  }else{
    h+='<div class="kv"><span>Classes taken</span><b>'+m.taken+'</b></div>';

  if(c.loginInfo)h+='<div class="tiny muted" style="margin-top:6px">🔑 '+esc(c.loginInfo)+'</div>';

     '<button class="btn ghost sm" data-edit-class="'+c.id+'">Edit</button>'+
     ((c.feeType==="prepaid"||c.feeType==="postpaid")?'<button class="btn line sm" data-newpack="'+c.id+'">'+(c.feeType==="prepaid"?"Start new pack":"Reset count")+'</button>':"")+
     (c.active===false?'<button class="btn sm" data-reactivate="'+c.id+'">Resume</button>':"")+
     (c.link?'<a class="btn line sm joinbtn" href="'+esc(c.link)+'" target="_blank" rel="noopener">Join</a>':"")+
     (c.location?'<a class="btn line sm joinbtn" href="'+mapUrl(c.location)+'" target="_blank" rel="noopener">📍 Directions</a>':"")+
     (c.feeType!=="free"?'<button class="btn line sm" data-pay-class="'+c.id+'">Log payment</button>':"")+

/* ----- MONEY ----- */
function renderMoney(){
  var h='<div class="hint">Fees stay in their own currency. Prepaid shows credits left; postpaid shows what you still owe. Log a payment from any class.</div>';
  h+=childTabs("moneyChild");
  h+='<button class="btn line block sm" id="spendReport" style="margin:0 0 10px">📊 Spending report (year totals by child & class)</button>';
  // currency totals
  var paid={},out={};
  var kids=current.moneyChild==="all"?state.children:state.children.filter(function(c){return c.id===current.moneyChild;});
  var kidIds=kids.map(function(k){return k.id;});
  state.classes.filter(function(c){return kidIds.indexOf(c.childId)>=0;}).forEach(function(c){
    var m=classMoney(c);
    for(var cur in m.paidByCur){if(cur)paid[cur]=(paid[cur]||0)+m.paidByCur[cur];}
    for(var cu in m.outByCur){if(cu)out[cu]=(out[cu]||0)+m.outByCur[cu];}
  });
  function fmtTot(obj){var ks=Object.keys(obj);if(!ks.length)return "—";return ks.map(function(k){return k+" "+Number(obj[k]).toLocaleString();}).join(" · ");}
  h+='<div class="card"><div class="body">';
  h+='<div style="font-weight:700;margin-bottom:6px">Totals</div>';
  h+='<div class="totline"><span>Paid so far</span><b>'+fmtTot(paid)+'</b></div>';
  h+='<div class="totline"><span>Estimated outstanding</span><b style="color:#d97706">'+fmtTot(out)+'</b></div>';
  h+='<div class="tiny muted" style="margin-top:4px">Outstanding excludes classes where the per-class fee isn’t set yet.</div>';
  h+='</div></div>';
  // per class
  kids.forEach(function(ch){
    h+='<h2 class="section">'+childIcon(ch)+" "+esc(ch.name)+'</h2>';
    state.classes.filter(function(c){return c.childId===ch.id;}).forEach(function(c){
      var m=classMoney(c);
      h+='<div class="card"><div class="body">';
      h+='<div class="row"><div class="stripe" style="background:'+c.color+';min-height:22px"></div>'+
         '<div style="flex:1;font-weight:700">'+esc(c.name)+'</div>';
      h+=(c.feeType==="free"?'<span class="pill green">Free</span>':'<span class="pill '+(c.feeType==="postpaid"?"amber":"")+'">'+c.feeType+(c.currency?" · "+c.currency:"")+'</span>')+'</div>';
      if(c.feeType==="free"){h+='<div class="small muted" style="margin-top:6px">No fees.</div>';}
      else{
        var paidStr=Object.keys(m.paidByCur).length?Object.keys(m.paidByCur).map(function(cu){return money(m.paidByCur[cu],cu);}).join(" · "):"Nothing logged";
        h+='<div class="kv" style="margin-top:6px"><span>Paid</span><b>'+paidStr+'</b></div>';
        if(c.feeType==="prepaid"){
          h+='<div class="kv"><span>Credits left</span><b'+(m.remaining<=1?' style="color:#dc2626"':"")+'>'+(m.prepaidClasses>0?(m.cycleStart?m.remaining+" / "+m.prepaidClasses:(""+m.remaining)):"—")+'</b></div>';
        }else if(c.feeType==="monthly"){
          h+='<div class="kv"><span>Monthly fee</span><b>'+((c.perClassFee&&c.currency)?money(c.perClassFee,c.currency):"—")+'</b></div>';
        }else{
          h+='<div class="kv"><span>Unpaid classes</span><b'+(m.unpaid>0?' style="color:#d97706"':"")+'>'+m.unpaid+(c.perClassFee&&c.currency&&m.unpaid>0?" · ≈ "+money(m.unpaid*c.perClassFee,c.currency):"")+'</b></div>';
        }
      }
      if(c.payMode)h+='<div class="tiny muted" style="margin-top:6px">💳 '+esc(c.payMode)+'</div>';
      h+='<div class="row" style="margin-top:10px;gap:8px">'+
         (c.feeType!=="free"?'<button class="btn sm" data-pay-class="'+c.id+'">+ Log payment</button>':"")+
         '<button class="btn line sm" data-history="'+c.id+'">History</button></div>';
      h+='</div></div>';
    });
  });
  return h;
}

function childIcon(ch){
  if(!ch)return "🧒";
  if(ch.photo)return '<img class="avatar" src="'+ch.photo+'" alt="">';
  var ad=ch.type==="adult";
  if(ch.gender==="female")return ad?"👩":"👧";
  if(ch.gender==="male")return ad?"👨":"👦";
  if(ch.gender==="girl")return "👧";
  if(ch.gender==="boy")return "👦";
  return ad?"🧑":(ch.emoji||"🧒");
}
function childAge(ch){
  if(ch&&ch.dob){var b=parseISO(ch.dob),t=new Date();var a=t.getFullYear()-b.getFullYear();
    var m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return a>=0?a:"";}
  return (ch&&(ch.age===0||ch.age))?ch.age:"";
}
function resizeImage(file,max,cb){
  var rd=new FileReader();
  rd.onload=function(){var img=new Image();img.onload=function(){
    var w=img.width,h=img.height,sc=Math.min(max/w,max/h,1);
    var cw=Math.round(w*sc),chh=Math.round(h*sc);
    var cv=document.createElement("canvas");cv.width=cw;cv.height=chh;
    cv.getContext("2d").drawImage(img,0,0,cw,chh);
    cb(cv.toDataURL("image/jpeg",0.82));
  };img.src=rd.result;};
  rd.readAsDataURL(file);
}
function waText(t){window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");}
function mapUrl(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
function waClassSession(classId,date,time){
  var c=classById(classId),ch=childById(c.childId),d=parseISO(date);
  var t=ch.name+" has "+c.name+" on "+DAYSLONG[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+
        (time?" at "+fmtTime(time):"")+"."+(c.link?"\nJoin: "+c.link:"");

function waAttendedLog(classId){
  var c=classById(classId),ch=childById(c.childId);
  var cyc=((c.feeType==="prepaid"||c.feeType==="postpaid")&&c.cycleStart)?c.cycleStart:null;
  var recs=state.attendance.filter(function(a){return a.classId===classId&&a.status==="attended"&&(!cyc||(a.date&&a.date>=cyc));})
    .sort(function(x,y){return x.date.localeCompare(y.date);});
  var base=(!cyc&&c.openingTaken)?+c.openingTaken:0;
  var lines=recs.map(function(a,i){var d=parseISO(a.date);return (base+i+1)+". "+DAYS[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];});
  var total=base+recs.length;
  var t="Attendance log — "+ch.name+" · "+c.name+(cyc?" (current pack, since "+fmtDateShort(parseISO(cyc))+")":"")+"\nTotal classes attended: "+total+
        (base?" (incl. "+base+" carried over)":"")+(lines.length?"\n\n"+lines.join("\n"):"");
  waText(t);
}

/* session action sheet */
function sessionActions(classId,date,time,kind){
  var c=classById(classId);var ch=childById(c.childId);var att=getAtt(classId,date);
  var status=att?att.status:"scheduled";var d=parseISO(date);
  var h='<h3>'+esc(c.name)+' · '+childIcon(ch)+' '+esc(ch.name)+'</h3>';
  h+='<div class="muted small" style="margin-top:-8px;margin-bottom:12px">'+DAYSLONG[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]+(time?" · "+fmtTime(time):"")+'</div>';
  h+='<div class="action-list">';
  h+='<button data-sa="attend">✅ Mark attended<span class="sub">Counts toward classes taken</span></button>';
  h+='<button data-sa="cancel">🚫 Class cancelled by teacher<span class="sub">Class didn’t run — not counted</span></button>';
  h+='<button data-sa="missed">🙅 We cancelled / child absent<span class="sub">Counted only if this class charges for it</span></button>';
  h+='<button data-sa="move">↔️ Move to another day<span class="sub">Reschedule this week</span></button>';
  h+='<button data-sa="note">📝 Add / edit note</button>';
  h+='<button data-sa="whatsapp">💬 Share on WhatsApp<span class="sub">Message a parent/guardian about this class</span></button>';
  if(status!=="scheduled")h+='<button data-sa="reset">↩️ Reset to scheduled</button>';
  if(kind==="extra")h+='<button data-sa="delete" style="color:#dc2626">🗑️ Delete this session</button>';
  h+='</div>';
  h+='<div class="sheet-actions"><button class="btn ghost block" data-close>Close</button></div>';
  openSheet(h);
  sheet.querySelectorAll("[data-sa]").forEach(function(b){
    b.onclick=function(){
      var a=b.getAttribute("data-sa");
      if(a==="attend"){upsertAtt(classId,date,{status:"attended",time:time});closeSheet();render();}
      else if(a==="cancel"){upsertAtt(classId,date,{status:"cancelled",time:time});closeSheet();render();}
      else if(a==="missed"){upsertAtt(classId,date,{status:"missed",time:time});closeSheet();render();}
      else if(a==="reset"){upsertAtt(classId,date,{status:"scheduled"});closeSheet();render();}
      else if(a==="note"){
        var cur=att&&att.note?att.note:"";var n=prompt("Note for this session:",cur);
        if(n!==null){upsertAtt(classId,date,{note:n,time:time});closeSheet();render();}
      }
      else if(a==="delete"){
        state.attendance=state.attendance.filter(function(x){return !(x.classId===classId&&x.date===date&&x.isExtra);});
        save();closeSheet();render();
      }
      else if(a==="whatsapp"){closeSheet();waClassSession(classId,date,time);}
      else if(a==="move"){moveSession(classId,date,time);}
    };
  });
  sheet.querySelector("[data-close]").onclick=closeSheet;
}
function moveSession(classId,fromDate,fromTime){
  var c=classById(classId);

/* backup / restore */
function doBackup(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="kidule-backup-"+isoOf(new Date())+".json";a.click();
}
/* Checks that a restored file actually looks like a Kidule backup
   before we let it replace everything on this device. */
function looksLikeBackup(d){
  if(!d||typeof d!=="object")return false;
  var lists=["children","classes","attendance","payments"];
  for(var i=0;i<lists.length;i++){
    if(!Array.isArray(d[lists[i]]))return false;      // each must be a list, even if empty
  }
  for(var j=0;j<d.children.length;j++){
    var c=d.children[j];
    if(!c||typeof c!=="object"||!c.id||!c.name)return false;  // each child needs an id+name
  }
  for(var k=0;k<d.classes.length;k++){
    var cl=d.classes[k];
    if(!cl||typeof cl!=="object"||!cl.id||!cl.childId)return false; // each class needs an id + owner
  }
  return true;
}
function doRestore(){
  var inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){
      var d;
      try{d=JSON.parse(r.result);}catch(e){alert("Could not read this file — it isn't valid JSON.");return;}
      if(!looksLikeBackup(d)){alert("This doesn't look like a Kidule backup file, so nothing was changed.");return;}
      if(!confirm("Restore this backup? It will replace everything currently on this device."))return;
      if(!d.currencies)d.currencies=[];if(!d.events)d.events=[];
      state=d;save();render();alert("Restored.");
    };
    r.readAsText(f);};
  inp.click();
}

/* Delete attendance & payment records older than 1 year, to keep
   on-device storage small. Children, classes and current balances
   are never touched — this only trims old history rows. */
function oldDataCutoff(){var d=new Date();d.setFullYear(d.getFullYear()-1);return isoOf(d);}
function countOldData(){
  var cutoff=oldDataCutoff();
  var att=state.attendance.filter(function(a){return a.date&&a.date<cutoff;}).length;
  var pay=state.payments.filter(function(p){return p.date&&p.date<cutoff;}).length;
  return {att:att,pay:pay,cutoff:cutoff};
}
function purgeOldDataSheet(){
  var n=countOldData();
  var total=n.att+n.pay;
  var h='<h3>Delete old data</h3>';
  if(total===0){
    h+='<div class="small muted">No attendance or payment records older than 1 year ('+fmtDateShort(parseISO(n.cutoff))+') were found. Nothing to delete.</div>';
    h+='<div class="sheet-actions"><button class="btn ghost block" data-close>Close</button></div>';
    openSheet(h);sheet.querySelector("[data-close]").onclick=closeSheet;return;
  }
  h+='<div class="small">This removes attendance and payment history dated before <b>'+fmtDateShort(parseISO(n.cutoff))+'</b>:</div>';
  h+='<div class="kv" style="margin-top:8px"><span>Attendance records</span><b>'+n.att+'</b></div>';
  h+='<div class="kv"><span>Payment records</span><b>'+n.pay+'</b></div>';
  h+='<div class="tiny muted" style="margin-top:8px">Children, classes and anything newer than 1 year are not touched. This cannot be undone — take a backup first if you want to keep a copy.</div>';
  h+='<div class="sheet-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="pdGo" style="flex:1">Delete '+total+' old record'+(total>1?"s":"")+'</button></div>';
  openSheet(h);
  sheet.querySelector("[data-close]").onclick=closeSheet;
  sheet.querySelector("#pdGo").onclick=function(){
    var cutoff=n.cutoff;
    state.attendance=state.attendance.filter(function(a){return !(a.date&&a.date<cutoff);});
    state.payments=state.payments.filter(function(p){return !(p.date&&p.date<cutoff);});
    save();closeSheet();render();alert("Old data deleted.");
  };
}

  if(pre)h+='<div class="grid2"><label class="fld">Classes in this pack<input type="number" id="npSize" inputmode="numeric" value="'+(c.packageSize||12)+'"></label>'+
     '<label class="fld">Pack start date<input type="date" id="npDate" value="'+isoOf(new Date())+'"></label></div>';
  else h+='<label class="fld">Count from date<input type="date" id="npDate" value="'+isoOf(new Date())+'"></label>';
  h+='<label class="fld"><input type="checkbox" id="npPay"'+(pre?" checked":"")+' style="width:auto;margin-right:6px">Also log a payment</label>';
  h+='<div id="npPayBlk"'+(pre?"":' style="display:none"')+'><div class="grid2"><label class="fld">Amount paid<input type="number" id="npAmt" inputmode="decimal" value="'+((pre&&c.perClassFee&&c.packageSize)?c.perClassFee*c.packageSize:"")+'"></label>'+
     '<label class="fld">Currency<select id="npCur">'+currencyOptions(c.currency)+'</select></label></div>'+
     (pre?"":'<label class="fld">Classes this payment covers (optional)<input type="number" id="npCov" inputmode="numeric"></label>')+'</div>';
  h+='<div class="sheet-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="npSave" style="flex:1">'+(pre?"Start pack":"Reset count")+'</button></div>';
  openSheet(h);
  sheet.querySelector("[data-close]").onclick=closeSheet;
  var npCur=document.getElementById("npCur");if(npCur)npCur.onchange=function(){if(npCur.value==="__add"){var v=addCurrencyPrompt();npCur.innerHTML=currencyOptions(v);}};
  var npPay=document.getElementById("npPay");npPay.onchange=function(){document.getElementById("npPayBlk").style.display=npPay.checked?"":"none";};
  sheet.querySelector("#npSave").onclick=function(){
    var d=document.getElementById("npDate").value||isoOf(new Date());
    if(pre){var size=parseInt(document.getElementById("npSize").value,10);
      if(isNaN(size)||size<=0){alert("Enter the number of classes in the pack");return;}
      c.cycleStart=d;c.cycleSize=size;}
    else{c.cycleStart=d;c.cycleSize=null;}
    if(document.getElementById("npPay").checked){
      var amt=parseFloat(document.getElementById("npAmt").value);
      if(!isNaN(amt)){
        var cov=pre?c.cycleSize:parseInt((document.getElementById("npCov")||{}).value,10);
        state.payments.push({id:uid(),classId:classId,date:d,amount:amt,currency:document.getElementById("npCur").value,classesCovered:isNaN(cov)?null:cov,type:c.feeType,note:pre?"New pack":"Settlement"});
      }
    }
    save();closeSheet();render();
  };
}

function spendingReport(year){
  var pays=(state.payments||[]).filter(function(p){return p.amount;});
  var years=[];pays.forEach(function(p){var y=(p.date||"").slice(0,4);if(y&&years.indexOf(y)<0)years.push(y);});
  years.sort();
  if(!year)year="all";
  var filt=year==="all"?pays:pays.filter(function(p){return (p.date||"").slice(0,4)===year;});
  function fmtC(obj){var ks=Object.keys(obj);return ks.length?ks.map(function(k){return k+" "+Number(obj[k]).toLocaleString();}).join(" · "):"—";}
  var h='<h3>Spending report</h3>';
  h+='<div class="child-tab" style="flex-wrap:wrap"><button data-yr="all" class="'+(year==="all"?"on":"")+'">All time</button>';
  years.forEach(function(y){h+='<button data-yr="'+y+'" class="'+(year===y?"on":"")+'">'+y+'</button>';});
  h+='</div>';
  var grand={};filt.forEach(function(p){grand[p.currency]=(grand[p.currency]||0)+(+p.amount||0);});
  h+='<div class="card"><div class="body"><div class="totline"><span style="font-weight:700">Total spent</span><b>'+fmtC(grand)+'</b></div></div></div>';
  var shown=0;
  state.children.forEach(function(ch){
    var chPays=filt.filter(function(p){var c=classById(p.classId);return c&&c.childId===ch.id;});
    if(!chPays.length)return;
    shown+=chPays.length;
    var chTot={};chPays.forEach(function(p){chTot[p.currency]=(chTot[p.currency]||0)+(+p.amount||0);});
    h+='<h2 class="section">'+childIcon(ch)+" "+esc(ch.name)+' · '+fmtC(chTot)+'</h2>';
    state.classes.filter(function(c){return c.childId===ch.id;}).forEach(function(c){
      var cPays=chPays.filter(function(p){return p.classId===c.id;});
      if(!cPays.length)return;
      var cTot={};cPays.forEach(function(p){cTot[p.currency]=(cTot[p.currency]||0)+(+p.amount||0);});
      h+='<div class="kv" style="padding:7px 2px;border-bottom:1px solid var(--line)"><span>'+esc(c.name)+' <span class="tiny muted">('+cPays.length+" payment"+(cPays.length>1?"s":"")+')</span></span><b>'+fmtC(cTot)+'</b></div>';
    });
  });
  var orphan=filt.filter(function(p){return !classById(p.classId);});
  if(orphan.length){var oTot={};orphan.forEach(function(p){oTot[p.currency]=(oTot[p.currency]||0)+(+p.amount||0);});
    h+='<h2 class="section">Removed classes · '+fmtC(oTot)+'</h2>';}
  if(!shown&&!orphan.length)h+='<div class="empty">No payments logged'+(year==="all"?" yet":" in "+year)+'.</div>';
  h+='<div class="sheet-actions"><button class="btn ghost block" data-close>Close</button></div>';
  openSheet(h);
  sheet.querySelectorAll("[data-yr]").forEach(function(b){b.onclick=function(){spendingReport(b.getAttribute("data-yr"));};});
  sheet.querySelector("[data-close]").onclick=closeSheet;
}

function renderKid(){
  var ws=current.weekStart;var start=parseISO(ws);var end=addDays(start,6);var byDay=weekSessions(ws);var todayIso=isoOf(new Date());
  var h='<div id="kidTitle" style="padding:8px 0 2px;font-weight:700;font-size:18px">This week\u2019s classes</div>';
  h+='<div class="weeknav"><button class="btn ghost sm" data-week="-1">\u2039</button><div class="label">'+start.getDate()+" "+MON[start.getMonth()]+" \u2013 "+end.getDate()+" "+MON[end.getMonth()]+'</div><button class="btn ghost sm" data-week="1">\u203a</button></div>';
  h+='<div class="row" style="margin-bottom:6px"><button class="btn line sm" data-week="0">This week</button></div>';
  var anyWeek=false;
  for(var i=0;i<7;i++){
    var date=addDays(start,i);var diso=isoOf(date);var isToday=diso===todayIso;
    if(byDay[i].length===0)continue;anyWeek=true;
    h+='<div class="daygroup"><div class="dayhead'+(isToday?" today":"")+'">'+(isToday?'<span class="dot"></span>':"")+'<span class="dname">'+DAYSLONG[date.getDay()]+'</span><span class="muted small">'+date.getDate()+" "+MON[date.getMonth()]+(isToday?" \u00b7 Today":"")+'</span></div>';
    byDay[i].forEach(function(s){
      if(s.kind==="event"){var ev=s.event;var eb=ev.status==="cancelled"?'<span class="pill red">Off</span>':ev.status==="attended"?'<span class="pill green">Done</span>':'<span class="pill">One-time</span>';
        h+='<div class="sess'+(ev.status==="cancelled"?" cancelled":"")+'" style="cursor:default"><div class="stripe" style="background:'+(ev.color||"#8b5cf6")+'"></div><div class="time">'+(ev.time?fmtTime(ev.time):"\u2014")+'</div><div style="flex:1"><div style="font-weight:600">'+esc(ev.title)+'</div></div><div>'+eb+'</div></div>';return;}
      var c=classById(s.classId);var ch=childById(c.childId);
      var badge=s.status==="attended"?'<span class="pill green">\u2713</span>':s.status==="cancelled"?'<span class="pill red">Class off</span>':s.status==="missed"?'<span class="pill amber">Absent</span>':s.status==="moved"?'<span class="pill amber">Moved</span>':"";
      var quick=(c.link?'<a class="btn sm joinbtn" href="'+esc(c.link)+'" target="_blank" rel="noopener">Join</a>':"")+(c.location?'<a class="btn line sm joinbtn" href="'+mapUrl(c.location)+'" target="_blank" rel="noopener">\ud83d\udccd</a>':"");
      h+='<div class="sess'+(s.status==="cancelled"?" cancelled":"")+(s.status==="attended"?" done":"")+'" style="cursor:default"><div class="stripe" style="background:'+c.color+'"></div><div class="time">'+(s.time?fmtTime(s.time):"\u2014")+'</div><div style="flex:1"><div style="font-weight:600">'+esc(c.name)+'</div><div class="who">'+childIcon(ch)+" "+esc(ch.name)+'</div></div>'+(quick?'<div class="row" style="gap:6px;flex:0 0 auto">'+quick+'</div>':"")+'<div>'+badge+'</div></div>';
    });
    h+='</div>';
  }
  if(!anyWeek)h+='<div class="empty">No classes scheduled this week.</div>';
  h+='<div class="tiny muted" style="margin-top:10px">View only \u00b7 tap Join to enter an online class.</div>';
  return h;
}

/* ---------------- event binding ---------------- */
function bindView(){
  var v=document.getElementById("view");
  var kt=document.getElementById("kidTitle");
  if(kt){var _kn=0;kt.onclick=function(){_kn++;if(_kn>=5){_kn=0;if(confirm("Exit kid mode on this device and show the full app?")){try{localStorage.removeItem("ct_kidlock");}catch(e){} location.reload();}}};}
  v.querySelectorAll("[data-week]").forEach(function(b){b.onclick=function(){
    var d=b.getAttribute("data-week");
    if(d==="0")current.weekStart=isoOf(weekStart(new Date()));
    else current.weekStart=isoOf(addDays(parseISO(current.weekStart),+d*7));
    render();
  };});
  var addS=document.getElementById("addSess");if(addS)addS.onclick=function(){addSessionSheet();};
  v.querySelectorAll("[data-open-sess]").forEach(function(el){el.onclick=function(){
    var p=el.getAttribute("data-open-sess").split("|");sessionActions(p[0],p[1],p[2],p[3]);
  };});
  v.querySelectorAll("[data-open-event]").forEach(function(el){el.onclick=function(){eventActions(el.getAttribute("data-open-event"));};});
  v.querySelectorAll("[data-stop]").forEach(function(a){a.addEventListener("click",function(e){e.stopPropagation();});});
  v.querySelectorAll("[data-childfilter]").forEach(function(b){b.onclick=function(){
    var p=b.getAttribute("data-childfilter").split("|");current[p[0]]=p[1];render();
  };});
  v.querySelectorAll("[data-edit-class]").forEach(function(b){b.onclick=function(){classSheet(b.getAttribute("data-edit-class"));};});
  v.querySelectorAll("[data-add-class]").forEach(function(b){b.onclick=function(){classSheet(null,b.getAttribute("data-add-class"));};});
  v.querySelectorAll("[data-pay-class]").forEach(function(b){b.onclick=function(){paymentSheet(b.getAttribute("data-pay-class"));};});
  v.querySelectorAll("[data-quick-attend]").forEach(function(b){b.onclick=function(){quickAttend(b.getAttribute("data-quick-attend"));};});
  v.querySelectorAll("[data-history]").forEach(function(b){b.onclick=function(){historySheet(b.getAttribute("data-history"));};});
  v.querySelectorAll("[data-reactivate]").forEach(function(b){b.onclick=function(){var c=classById(b.getAttribute("data-reactivate"));c.active=true;save();render();};});
  v.querySelectorAll("[data-newpack]").forEach(function(b){b.onclick=function(){renewPack(b.getAttribute("data-newpack"));};});
  v.querySelectorAll("[data-edit-child]").forEach(function(b){b.onclick=function(){childSheet(b.getAttribute("data-edit-child"));};});
  var ac=document.getElementById("addChild");if(ac)ac.onclick=function(){childSheet();};
  var sr=document.getElementById("spendReport");if(sr)sr.onclick=function(){spendingReport("all");};
  var bk=document.getElementById("btnBackup");if(bk)bk.onclick=doBackup;
  var rs=document.getElementById("btnRestore");if(rs)rs.onclick=doRestore;
  var rt=document.getElementById("btnReset");if(rt)rt.onclick=function(){if(confirm("Reset everything back to the original setup? This erases your changes."))( function(){state=seed();save();render();} )();};
}
document.querySelectorAll("nav.tabbar button").forEach(function(b){b.onclick=function(){
  current.tab=b.getAttribute("data-tab");
  document.querySelectorAll("nav.tabbar button").forEach(function(x){x.classList.remove("on");});
  b.classList.add("on");render();
};});

function helpSheet(){
  var h='<h3>Help / FAQ</h3><div class="small" style="line-height:1.6">';
  h+='<p><b>What is the "Read-only week view" (kid mode)?</b><br>'+
     'It\u2019s a simplified screen that only shows this week\u2019s classes — no editing, no money info, no menu. '+
     'Open it from this menu, or by adding <code>?kid</code> to the app\u2019s address. '+
     'Great for handing your phone to a child or a caregiver so they can check the schedule without changing anything.</p>';
  h+='<p><b>How do I get back to the full app after locking kid view?</b><br>'+
     'Tap the "This week\u2019s classes" title 5 times in a row and confirm — that exits kid mode on this device.</p>';
  h+='<p><b>Is my data backed up anywhere online?</b><br>'+
     'No. Everything is stored only in this browser, on this device. Use "Backup to file" regularly, and especially before '+
     'clearing browser data, switching phones, or reinstalling the app.</p>';
  h+='<p><b>What does "Delete old data" remove?</b><br>'+
     'Only attendance and payment history older than 1 year. Children, classes and recent history are never touched, and it can\u2019t be undone — back up first.</p>';
  h+='</div>';
  h+='<div class="sheet-actions"><button class="btn ghost block" data-close>Close</button></div>';
  openSheet(h);
  sheet.querySelector("[data-close]").onclick=closeSheet;
}

/* ---------------- migration banner ----------------
   One-time (snoozable) notice telling testers to back up
   before the app's hosting address changes. Uses its own
   localStorage key so it never touches app data or backups. */
function migrateBannerInit(){
  var MBK="kidule_migrate_banner_v1";
  var el=document.getElementById("migrateBanner");
  if(!el||KID)return;   // never show in kid mode
  var st=null;
  try{var raw=localStorage.getItem(MBK);st=raw?JSON.parse(raw):null;}catch(e){}
  var now=Date.now();
  if(st&&(st.dismissed||(st.snoozeUntil&&now<st.snoozeUntil)))return;
  el.style.display="flex";
  document.getElementById("mb_backup").onclick=function(){
    doBackup();
    try{localStorage.setItem(MBK,JSON.stringify({dismissed:true}));}catch(e){}
    el.style.display="none";
  };
  document.getElementById("mb_later").onclick=function(){
    try{localStorage.setItem(MBK,JSON.stringify({snoozeUntil:now+24*60*60*1000}));}catch(e){}
    el.style.display="none";
  };
  document.getElementById("mb_close").onclick=function(){
    try{localStorage.setItem(MBK,JSON.stringify({dismissed:true}));}catch(e){}
    el.style.display="none";
  };
}

/* ---------------- boot ---------------- */
load();
if(KID)document.body.classList.add("kidmode");
render();
migrateBannerInit();

/* offline support */
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
